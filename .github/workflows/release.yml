# Builds the installer and the portable zip and publishes them as a GitHub Release.
# Trigger: push a tag like v1.2.0 (git tag v1.2.0 && git push origin v1.2.0).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The .iss needs Inno Setup 6.5+ (download + extractarchive); the runner's copy may be older.
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: ./build-installer.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v'))

      - name: Build portable zip
        run: ./build-portable.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v'))

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            (Get-ChildItem installer/output/*-setup.exe, installer/output/*-portable.zip).FullName `
            --title $env:GITHUB_REF_NAME --generate-notes

      # The Store package is built after the GitHub release so a problem here never blocks it.
      # It's not attached to the release (users can't install an unsigned MSIX); download the
      # store-package artifact from this run and upload it in Partner Center (see store/SUBMITTING.md).
      - name: Build Microsoft Store package
        run: ./build-store.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v'))

      - uses: actions/upload-artifact@v4
        with:
          name: store-package
          path: installer/output/*.msix
          if-no-files-found: error
          # Store submissions are made right after a release; no need to keep the default 90 days.
          retention-days: 30
